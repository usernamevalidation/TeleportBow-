name: TeleportBow
version: 1.0.0
main: com.usernamevalida.teleportbow.TeleportBow
api-version: '1.21'
author: usernamevalida
description: Teleport where your arrow lands, with safety checks.
commands:
  teleportbow:
    description: Reload the TeleportBow config.
    usage: /teleportbow reload
    permission: teleportbow.reload
permissions:
  teleportbow.reload:
    description: Allows reloading the config.
    default: op
  teleportbow.use:
    description: Allows using the teleport bow.
    default: true